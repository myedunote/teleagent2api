name: Release

# 发 release 时产出多平台二进制。
# 注意：镜像构建已独立到 docker.yml（push main / v* tag / 手动触发），
# 不要在这里再加 docker job —— 两边会在 latest 和 semver 标签上重复构建、互相竞争。

on:
  release:
    types: [published]

# 只需要 contents:write 上传 release 产物；镜像推送已移出，故不需要 packages:write
permissions:
  contents: write

jobs:
  build-binaries:
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          binary=teleagent2api
          if [ "$GOOS" = "windows" ]; then
            binary="${binary}.exe"
          fi
          go build -ldflags="-s -w" -o "$binary" .
          tarball="teleagent2api-${GOOS}-${GOARCH}.tar.gz"
          tar czf "$tarball" "$binary"
          echo "tarball=$tarball" >> "$GITHUB_ENV"

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.tarball }}
